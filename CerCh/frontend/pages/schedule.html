<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시험 일정 - 테크스캔</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/common.css" />
  <style>
    .schedule-layout { display: flex; gap: 24px; }
    .schedule-main { flex: 1; }
    .sidebar { width: 260px; flex-shrink: 0; }
    .section-title { font-size: 16px; font-weight: 700; color: #1a1a1a; margin-bottom: 16px; }
    .exam-card {
      background: #fff; border: 1px solid #e8e8e8; border-radius: 10px;
      padding: 18px 20px; margin-bottom: 10px; display: flex; align-items: center; gap: 16px;
    }
    .dday-badge {
      flex-shrink: 0; width: 64px; height: 64px; border-radius: 10px;
      background: #f0fdf4; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
    }
    .dday-badge .d { font-size: 11px; color: #16a34a; font-weight: 600; }
    .dday-badge .num { font-size: 20px; font-weight: 800; color: #15803d; line-height: 1; }
    .dday-badge.soon { background: #fef2f2; }
    .dday-badge.soon .d, .dday-badge.soon .num { color: #ef4444; }
    .dday-badge.week { background: #fff7ed; }
    .dday-badge.week .d, .dday-badge.week .num { color: #f97316; }
    .exam-info { flex: 1; }
    .exam-name { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
    .exam-org  { font-size: 12px; color: #888; margin-bottom: 6px; }
    .exam-dates { display: flex; gap: 12px; }
    .exam-date-item { font-size: 12px; color: #555; }
    .exam-date-item strong { color: #1a1a1a; }
    .exam-actions { display: flex; gap: 8px; flex-direction: column; align-items: flex-end; }
    .bookmark-btn {
      padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 500;
      border: 1px solid #ddd; background: #fff; color: #555; cursor: pointer; font-family: inherit;
    }
    .bookmark-btn:hover { border-color: #22c55e; color: #22c55e; }
    .official-link { font-size: 11px; color: #22c55e; text-decoration: none; }
    .official-link:hover { text-decoration: underline; }
    .cal-wrap { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 16px; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-title { font-size: 14px; font-weight: 600; color: #1a1a1a; }
    .cal-nav { background: none; border: none; font-size: 18px; color: #555; cursor: pointer; padding: 0 4px; }
    .cal-nav:hover { color: #22c55e; }
    .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 10px; color: #aaa; font-weight: 500; margin-bottom: 4px; }
    .cal-days span:first-child { color: #f87171; }
    .cal-days span:last-child  { color: #60a5fa; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 2px; }
    .cal-grid span {
      font-size: 11px; color: #333; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; width: 26px; height: 26px; margin: auto; cursor: pointer; transition: background 0.15s;
    }
    .cal-grid span:hover { background: #f0fdf4; }
    .cal-grid span.today { background: #22c55e; color: #fff !important; font-weight: 600; }
    .cal-grid span.other-month { color: #ddd; }
    .cal-grid span.has-exam { background: #dcfce7; color: #15803d; font-weight: 600; }
    .cal-grid span.sun { color: #f87171; }
    .cal-grid span.sat { color: #60a5fa; }
    .filter-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .tag-btn {
      padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
      border: 1px solid #ddd; background: #fff; color: #555; cursor: pointer; font-family: inherit;
    }
    .tag-btn.active { background: #15803d; color: #fff; border-color: #15803d; }
  </style>
</head>
<body>

  <header class="header-wrap">
    <div class="header-inner">
      <div class="logo" onclick="location.href='../index.html'">
        <div class="logo-icon">
          <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" width="16" height="16">
            <polyline points="2,12 6,7 9,10 14,4"/>
          </svg>
        </div>
        <span class="logo-text">테크스캔</span>
      </div>
      <div class="search-wrap">
        <input class="search-input" type="text" placeholder="기술, 자격증, 회사명으로 검색" />
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="8.5" cy="8.5" r="5.5"/><line x1="13" y1="13" x2="18" y2="18"/>
        </svg>
      </div>
      <div class="header-actions">
        <button class="btn-outline" onclick="location.href='login.html'">로그인</button>
        <button class="btn-outline" onclick="location.href='register.html'">회원가입</button>
      </div>
    </div>
  </header>

  <nav class="menubar-wrap">
    <div class="menubar-inner">
      <a class="menu-item inactive" href="../index.html">분석</a>
      <a class="menu-item inactive" href="community.html">커뮤니티</a>
      <a class="menu-item" href="schedule.html">일정</a>
      <a class="menu-item inactive" href="mypage.html">마이페이지</a>
    </div>
  </nav>

  <main class="content-area">
    <div class="schedule-layout">
      <div class="schedule-main">
        <div class="filter-tags">
          <button class="tag-btn active">전체</button>
          <button class="tag-btn">국가기술자격</button>
          <button class="tag-btn">클라우드</button>
          <button class="tag-btn">데이터베이스</button>
          <button class="tag-btn">네트워크</button>
          <button class="tag-btn">어학</button>
        </div>

        <div class="section-title">다가오는 시험 일정</div>

        <div class="exam-card" id="exams-container"></div>
      </div>

      <div class="sidebar">
        <div class="cal-wrap">
          <div class="cal-header">
            <button class="cal-nav" id="prev">&#8249;</button>
            <span class="cal-title" id="cal-title"></span>
            <button class="cal-nav" id="next">&#8250;</button>
          </div>
          <div class="cal-days">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-wrap">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-logo">
          <div class="logo-icon" style="width:22px;height:22px;">
            <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" width="12" height="12">
              <polyline points="2,12 6,7 9,10 14,4"/>
            </svg>
          </div>
          <span style="font-size:16px;font-weight:700;color:#15803d;">테크스캔</span>
        </div>
        <p class="footer-desc">기업 채용공고 기반 기술 · 자격증 트렌드를 한눈에 확인하세요.</p>
      </div>
      <div class="footer-links">
        <div class="footer-col">
          <div class="footer-col-title">서비스</div>
          <a href="../index.html">기술 분석</a>
          <a href="schedule.html">시험 일정</a>
          <a href="community.html">커뮤니티</a>
        </div>
        <div class="footer-col">
          <div class="footer-col-title">정책</div>
          <a href="#">이용약관</a>
          <a href="#">개인정보처리방침</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom"><span>© 2026 테크스캔. All rights reserved.</span></div>
  </footer>

  <script src="../js/api.js"></script>
  <script>
    const exams = [
      { name: '정보처리기사 필기', org: '한국산업인력공단', examDate: '2026-06-07', regStart: '2026-05-01', regEnd: '2026-05-10' },
      { name: 'SQLD', org: '한국데이터산업진흥원', examDate: '2026-06-14', regStart: '2026-05-08', regEnd: '2026-05-22' },
      { name: '네트워크관리사 2급', org: '한국정보통신자격협회', examDate: '2026-07-05', regStart: '2026-06-01', regEnd: '2026-06-20' },
      { name: 'AWS SAA', org: 'Amazon Web Services', examDate: '2026-07-20', regStart: '상시', regEnd: '시험 전일' },
      { name: '정보처리기사 실기', org: '한국산업인력공단', examDate: '2026-08-09', regStart: '2026-07-01', regEnd: '2026-07-10' },
    ];

    const examDays = [7, 14]; // June days with exams

    function renderExams() {
      const container = document.getElementById('exams-container');
      container.style.cssText = 'display:flex;flex-direction:column;gap:10px;background:transparent;border:none;padding:0;';
      container.innerHTML = '';
      const today = new Date(); today.setHours(0,0,0,0);
      exams.forEach(exam => {
        const target = new Date(exam.examDate); target.setHours(0,0,0,0);
        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        if (diff < 0) return;
        const badgeClass = diff <= 3 ? 'soon' : diff <= 7 ? 'week' : '';
        const card = document.createElement('div');
        card.className = 'exam-card';
        card.innerHTML = `
          <div class="dday-badge ${badgeClass}">
            <span class="d">D</span>
            <span class="num">${diff === 0 ? 'DAY' : '-' + diff}</span>
          </div>
          <div class="exam-info">
            <div class="exam-name">${exam.name}</div>
            <div class="exam-org">${exam.org}</div>
            <div class="exam-dates">
              <div class="exam-date-item">시험일 <strong>${exam.examDate}</strong></div>
              <div class="exam-date-item">접수 <strong>${exam.regStart} ~ ${exam.regEnd}</strong></div>
            </div>
          </div>
          <div class="exam-actions">
            <button class="bookmark-btn">🔖 알림</button>
            <a class="official-link" href="#">공식 사이트 →</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    let cur = new Date();
    function renderCal() {
      const y = cur.getFullYear(), m = cur.getMonth();
      document.getElementById('cal-title').textContent = y + '년 ' + (m+1) + '월';
      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';
      const first = new Date(y, m, 1).getDay();
      const last  = new Date(y, m+1, 0).getDate();
      const today = new Date();
      for (let i = 0; i < first; i++) {
        const s = document.createElement('span');
        s.textContent = new Date(y, m, -first+i+1).getDate();
        s.className = 'other-month';
        grid.appendChild(s);
      }
      for (let d = 1; d <= last; d++) {
        const s = document.createElement('span');
        s.textContent = d;
        const dow = new Date(y, m, d).getDay();
        if (dow === 0) s.classList.add('sun');
        if (dow === 6) s.classList.add('sat');
        if (d === today.getDate() && m === today.getMonth() && y === today.getFullYear())
          s.classList.add('today');
        else if (examDays.includes(d) && m === 5)
          s.classList.add('has-exam');
        grid.appendChild(s);
      }
    }

    document.getElementById('prev').onclick = () => { cur.setMonth(cur.getMonth()-1); renderCal(); };
    document.getElementById('next').onclick = () => { cur.setMonth(cur.getMonth()+1); renderCal(); };

    renderExams();
    renderCal();

    document.querySelectorAll('.tag-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
