<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CerCh - 회원가입</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/register.css" />
</head>
<body>
  <div class="container">
    <a href="../index.html" class="logo">CerCh</a>

    <div class="card">
      <div class="field-group">
        <span class="field-label">이메일</span>
        <div class="input-row">
          <input type="email" id="reg-email" placeholder="이메일을 입력해주세요." />
        </div>
      </div>

      <div class="field-group">
        <span class="field-label">닉네임</span>
        <div class="input-row">
          <input type="text" id="reg-nickname" placeholder="닉네임 입력 (2~10자)" />
        </div>
      </div>

      <div class="field-group">
        <span class="field-label">비밀번호</span>
        <div class="input-row">
          <input type="password" id="reg-password" placeholder="비밀번호 입력 (8자 이상)" />
        </div>
      </div>

      <div class="field-group">
        <span class="field-label">비밀번호 확인</span>
        <div class="input-row">
          <input type="password" id="reg-password-confirm" placeholder="비밀번호 재입력" />
        </div>
      </div>

      <div id="reg-error" style="color:#ef4444;font-size:13px;text-align:center;margin-top:8px;display:none;"></div>
      <button class="btn-signup" id="btn-register">회원가입</button>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
