<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CerCh - 회원가입</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/register.css" />
</head>
<body>
  <div class="container">
    <a href="../index.html" class="logo">CerCh</a>

    <div class="card">
      <div class="field-group">
        <span class="field-label">아이디 입력</span>
        <div class="input-row">
          <input type="text" placeholder="아이디 입력(6 ~ 20자)" />
          <button class="btn-check">중복확인</button>
        </div>
      </div>

      <div class="field-group">
        <span class="field-label">비밀번호 입력</span>
        <div class="input-row">
          <input type="password" placeholder="비밀번호 입력(6 ~ 20자)" />
        </div>
      </div>

      <div class="field-group">
        <span class="field-label">비밀번호 재입력</span>
        <div class="input-row">
          <input type="password" placeholder="비밀번호 입력(6 ~ 20자)" />
        </div>
      </div>

      <div class="field-group">
        <span class="field-label">회원명 입력</span>
        <div class="input-row">
          <input type="text" placeholder="회원명 입력(4 ~ 20자)" />
        </div>
      </div>

      <button class="btn-signup">회원가입</button>
    </div>
  </div>
</body>
</html>
