<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - 테크스캔</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/common.css" />
  <style>
    .auth-wrap {
      min-height: calc(100vh - 200px); display: flex; align-items: center; justify-content: center; padding: 40px 0;
    }
    .auth-box {
      width: 400px; background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 40px;
    }
    .auth-logo { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 28px; }
    .auth-title { font-size: 22px; font-weight: 700; color: #1a1a1a; text-align: center; margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 13px; font-weight: 500; color: #444; margin-bottom: 6px; display: block; }
    .form-input {
      width: 100%; height: 44px; border: 1px solid #ddd; border-radius: 8px;
      padding: 0 14px; font-size: 14px; font-family: inherit; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.1); }
    .form-error { font-size: 12px; color: #ef4444; margin-top: 4px; display: none; }
    .submit-btn {
      width: 100%; height: 46px; border: none; border-radius: 8px;
      background: #22c55e; color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: inherit; margin-top: 8px; transition: background 0.15s;
    }
    .submit-btn:hover { background: #16a34a; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #888; }
    .auth-footer a { color: #22c55e; font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e8e8e8; }
    .divider span { font-size: 12px; color: #aaa; }
  </style>
</head>
<body>

  <header class="header-wrap">
    <div class="header-inner">
      <div class="logo" onclick="location.href='../index.html'">
        <div class="logo-icon">
          <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" width="16" height="16">
            <polyline points="2,12 6,7 9,10 14,4"/>
          </svg>
        </div>
        <span class="logo-text">테크스캔</span>
      </div>
      <div class="search-wrap">
        <input class="search-input" type="text" placeholder="기술, 자격증, 회사명으로 검색" />
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="8.5" cy="8.5" r="5.5"/><line x1="13" y1="13" x2="18" y2="18"/>
        </svg>
      </div>
      <div class="header-actions">
        <button class="btn-outline" onclick="location.href='register.html'">회원가입</button>
      </div>
    </div>
  </header>

  <nav class="menubar-wrap">
    <div class="menubar-inner">
      <a class="menu-item inactive" href="../index.html">분석</a>
      <a class="menu-item inactive" href="community.html">커뮤니티</a>
      <a class="menu-item inactive" href="schedule.html">일정</a>
      <a class="menu-item inactive" href="mypage.html">마이페이지</a>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" width="16" height="16">
            <polyline points="2,12 6,7 9,10 14,4"/>
          </svg>
        </div>
        <span class="logo-text">테크스캔</span>
      </div>
      <div class="auth-title">로그인</div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">이메일</label>
          <input class="form-input" type="email" id="email" placeholder="이메일 주소 입력" required />
          <div class="form-error" id="email-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">비밀번호</label>
          <input class="form-input" type="password" id="password" placeholder="비밀번호 입력" required />
          <div class="form-error" id="login-error"></div>
        </div>
        <button type="submit" class="submit-btn">로그인</button>
      </form>

      <div class="auth-footer">
        계정이 없으신가요? <a href="register.html">회원가입</a>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');

      try {
        const result = await login(email, password);
        if (result.access_token) {
          localStorage.setItem('token', result.access_token);
          localStorage.setItem('user', JSON.stringify(result.user));
          location.href = '../index.html';
        } else {
          errEl.textContent = result.detail || '이메일 또는 비밀번호를 확인해주세요.';
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = '서버 연결에 실패했습니다.';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
